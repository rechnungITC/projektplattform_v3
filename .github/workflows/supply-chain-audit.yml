name: Supply Chain Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: supply-chain-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PROJ-Y-173a: the verdict comes from the REPORT, not from npm's exit code.
      # `npm audit` exits 1 both when it finds an advisory and when it cannot reach
      # npm's advisory endpoint — measured 2026-09-04, while the registry itself
      # answered HTTP 200 in 0.07s. A required security check that reads an outage
      # as "security problem" teaches people to click red security gates away.
      #
      # The gate retries, then reports exit 2 for "endpoint unreachable", which is
      # explicitly NOT a clean bill of health — it is an unanswered question, and
      # the fallback step below has to answer it from the second source.
      - name: Audit production dependency tree
        id: audit
        run: |
          set +e
          npm run check:npm-audit-gate
          code=$?
          set -e
          echo "outcome=$code" >> "$GITHUB_OUTPUT"
          # 0 clean, 1 findings or unclassifiable (fail-closed), 2 endpoint down.
          if [ "$code" -eq 2 ]; then exit 0; fi
          exit "$code"

      # Coverage, not a waiver. If npm's endpoint is down we still owe an answer,
      # and PROJ-147 put a second, independent advisory source in place for exactly
      # this. It runs here in the same job so this job's own conclusion stays
      # honest: if OSV also fails, this job fails. No `continue-on-error` anywhere —
      # that would rebuild the decorative gate PROJ-147 removed.
      #
      # Named residual risk: OSV and npm are different databases. An advisory only
      # npm knows would pass unseen for the duration of the outage. That is a
      # smaller hole than either blocking every PR on a foreign outage or waving
      # the check through blind, and it is bounded by the outage.
      - name: Fallback coverage via OSV when npm's advisory endpoint is down
        if: steps.audit.outputs.outcome == '2'
        env:
          OSV_SCANNER_VERSION: v2.5.0
        run: |
          echo "::warning::npm's advisory endpoint was unreachable across every attempt. This job did NOT audit against npm's database; coverage for this run comes from the OSV scanner instead. Re-run once npm recovers if you want both sources."
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSL -O "${base}/osv-scanner_linux_amd64"
          curl -fsSL -O "${base}/osv-scanner_SHA256SUMS"
          grep 'osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          set +e
          ./osv-scanner_linux_amd64 scan -L package-lock.json --format json > osv-fallback.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::fallback osv-scanner exited with $code, which is not a findings result — no coverage was obtained"
            exit "$code"
          fi
          npm run check:osv-gate -- osv-fallback.json

  # Account-free second opinion, replacing the decorative Snyk check (PROJ-147).
  #
  # Why not `actions/dependency-review-action`, which PROJ-74 originally intended:
  # it was built and it FAILED here with "Dependency review is not supported on
  # this repository. Please ensure that Dependency graph is enabled" (run
  # 31703387838). Being a public repo is not sufficient — this repository has its
  # security features switched off (dependency graph off, dependabot off, secret
  # scanning off). The documented OSV GitHub Action is no way around it either: it
  # ships as reusable workflows that upload SARIF and need `security-events:
  # write` plus code scanning, i.e. the same disabled family.
  #
  # So the scanner runs as a plain CLI: no GitHub feature, no account, no secret,
  # and it keeps working if someone flips those repo settings again. OSV is a
  # genuinely different advisory source than npm's, which is the point of a second
  # opinion.
  #
  # SCOPE, stated because it is NOT the same as npm audit: `npm audit` runs with
  # `--omit=dev` and judges production dependencies only. A lockfile scan cannot be
  # narrowed that way — neither SBOM input nor a dev-dependency filter is
  # documented for npm — so this job sees dev dependencies too and is therefore
  # BROADER. If that turns out to block pull requests on dev-only advisories, the
  # fix is a decision about policy (accept, or ignore-list), not a silent
  # `continue-on-error` — that would recreate exactly the decorative gate this
  # slice removes.
  osv-scanner:
    name: OSV scan of the dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to an exact release and checksum-verified. A supply-chain job that
      # curls an unpinned binary would be its own supply-chain hole.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.5.0
        run: |
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSL -O "${base}/osv-scanner_linux_amd64"
          curl -fsSL -O "${base}/osv-scanner_SHA256SUMS"
          grep 'osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          ./osv-scanner_linux_amd64 --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan package-lock.json against the OSV database
        run: |
          set +e
          ./osv-scanner_linux_amd64 scan -L package-lock.json --format json > osv-report.json
          code=$?
          set -e
          # 0 = nothing found, 1 = findings (severity is judged by the gate below).
          # Any other code is a scanner failure and must NOT read as "clean" — that
          # would be the decorative-gate defect all over again.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::osv-scanner exited with $code, which is not a findings result"
            exit "$code"
          fi

      # osv-scanner has no severity threshold and exits 1 on ANY finding, Low
      # included. The house norm is HIGH and above, so the threshold is drawn here.
      # Unit-tested in scripts/osv-gate/analyze.test.ts, and proven end-to-end in
      # both directions against real scanner output (PROJ-147 AC-147.3).
      - name: Gate on HIGH+ severity
        run: npm run check:osv-gate -- osv-report.json

  # PROJ-147 AC-147.7/AC-147.8: the `snyk` job that used to sit here is gone.
  # It never scanned anything — PROJ-74 deliberately left SNYK_TOKEN unset (no
  # external account wanted), so the job skipped, warned, and reported green
  # while being an enrolled required check: a second opinion that did not exist.
  # Its context `Snyk production dependency scan` was deregistered from the
  # `main protection` ruleset on 2026-08-20 and `OSV scan of the dependency
  # lockfile` was enrolled in its place, in one PUT so no gate was ever missing.
  # Removing the job only after the deregistration is deliberate: deleting it
  # while its context was still required would have left every PR waiting
  # forever on a status that is never reported (AC-147.8).
