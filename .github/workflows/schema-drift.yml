name: Schema Drift Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Auto-cancel duplicate runs on the same PR ref.
concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify SELECT columns vs migration schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Provision Supabase stubs (roles, schemas, extensions, helpers)
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          -- Roles. Postgres has no `create role if not exists`, hence DO-block.
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
          end $$;

          -- auth schema + minimal table + helper functions used by RLS policies.
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            created_at timestamptz default now()
          );
          create or replace function auth.uid() returns uuid
            language sql stable
            as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb
            language sql stable
            as $$ select '{}'::jsonb $$;
          create or replace function auth.role() returns text
            language sql stable
            as $$ select 'service_role'::text $$;

          -- extensions schema for Supabase-managed extensions (e.g. moddatetime).
          create schema if not exists extensions;
          create extension if not exists moddatetime schema extensions;

          -- PROJ-Y-130g: den search_path an Prod angleichen.
          --
          -- Prod läuft mit `"$user", public, extensions` (live gelesen), die Shadow-DB
          -- bisher mit dem Standard OHNE `extensions`. Genau daraus entstand die in
          -- CLAUDE.md notierte Beobachtung, die bare Form `moddatetime()` löse "in prod
          -- but not in the schema-drift shadow DB" auf — und daraus wiederum zwei der
          -- sieben Fresh-Apply-Abbrüche aus PROJ-Y-130f, mit 214 und 490 verlorenen
          -- Zeilen die beiden größten. Über die Kaskade (proj110 bricht vor der Zeile
          -- ab, in der es `stage_gate_prereadiness` anlegt) hängt ein dritter daran.
          --
          -- Die Angleichung baut also nichts nach, sondern beseitigt eine
          -- Umgebungsdifferenz: der Replay prüft ab hier gegen dieselbe Auflösung, die
          -- Prod verwendet. `alter database` wirkt auf neue Verbindungen, und die
          -- Migrationsschleife öffnet pro Datei eine — hier in dieser Session noch nicht,
          -- was für die Stubs oben aber unerheblich ist (alle voll qualifiziert).
          --
          -- Die CLAUDE.md-Regel bleibt trotzdem richtig und wird ab jetzt AUSDRÜCKLICH
          -- erzwungen statt als Nebenwirkung dieser Differenz: `npm run check:moddatetime`.
          -- Grund: in einer `SECURITY DEFINER`-Funktion mit `set search_path = public,
          -- pg_temp` löst die bare Form weiterhin NICHT auf — die Regel schützt vor mehr
          -- als vor diesem Replay.
          alter database postgres set search_path = "$user", public, extensions;

          -- storage schema stubs — minimum columns for FK references and policies.
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text,
            public boolean default false,
            owner uuid,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets(id),
            name text,
            owner uuid,
            metadata jsonb,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );
          alter table storage.objects enable row level security;
          SQL

      - name: Apply migrations
        env:
          PGPASSWORD: test
        run: |
          set -uo pipefail
          shopt -s nullglob
          count=0
          warnings=0
          failures=0
          skipped_total=0
          mkdir -p /tmp/drift-apply
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            log=/tmp/drift-apply/${base}.log
            if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f" > "$log" 2>&1; then
              count=$((count + 1))
            else
              # Tolerate the known-harmless pattern: REVOKE/GRANT on a function
              # that doesn't exist in this fresh-apply order (migration drift
              # pre-existing in the repo, not something for the drift-guard to
              # catch). Any other failure is a real structural error.
              if grep -qE "ERROR:.*function.*does not exist" "$log"; then
                # PROJ-Y-130f: die Meldung wurde hier bisher VERWORFEN. Sieben Dateien
                # brachen bei jedem Lauf still ab, und die Warnung schrieb die Ursache
                # "REVOKE/GRANT" fest, obwohl der grep oben nur "function does not
                # exist" prüft — das trifft auch ein `create trigger ... execute
                # function` oder einen Aufruf in einem DO-Block. Genau diese
                # unbelegte Zuschreibung hat verdeckt, WAS jeweils fehlschlägt.
                #
                # `ON_ERROR_STOP=1` beendet die Datei an der Fehlerstelle: alles
                # danach läuft nicht. Deshalb werden Fehlermeldung, Zeilennummer und
                # die Zahl der übersprungenen Zeilen ausgegeben.
                err=$(grep -m1 -E "^psql:.*ERROR:" "$log" || grep -m1 -E "ERROR:" "$log" || echo "(keine ERROR-Zeile im Log)")
                srcline=$(printf '%s' "$err" | sed -nE 's/^psql:[^:]*:([0-9]+):.*/\1/p')
                total=$(wc -l < "$f" | tr -d ' ')
                if [ -n "$srcline" ]; then
                  skipped=$((total - srcline))
                  detail="bricht Zeile ${srcline}/${total} ab; ${skipped} Zeile(n) danach laufen NICHT"
                else
                  # Ohne diese Zuweisung traegt `skipped` den Wert des VORIGEN
                  # Durchlaufs und die Summe unten waere falsch.
                  skipped=0
                  detail="Abbruchzeile nicht ermittelbar; Datei hat ${total} Zeile(n)"
                fi
                echo "::warning file=supabase/migrations/${base}::Fresh-Apply-Abbruch (toleriert): ${detail}. Ursache: ${err}"
                echo "  toleriert: ${base} — ${detail}"
                echo "             ${err}"
                warnings=$((warnings + 1))
                skipped_total=$((skipped_total + ${skipped:-0}))
              else
                echo "::error file=supabase/migrations/${base}::Migration failed with structural error:"
                tail -10 "$log"
                failures=$((failures + 1))
              fi
            fi
          done
          echo "Applied $count migration(s); $warnings tolerated abort(s); $failures structural failures."
          if [ "$warnings" -gt 0 ]; then
            # PROJ-Y-130f: die Zahl allein hat sieben Jahre lang nichts gesagt. Diese
            # Zeile benennt die Tragweite: der Replay ist um so viele Anweisungen
            # aermer als Prod, und genau darin steckt die Divergenz, die der
            # Spalten-Vergleich unten nicht sieht.
            echo "::notice::PROJ-Y-130f: $warnings Migration(en) brechen im Fresh-Apply ab; rund $skipped_total Zeile(n) laufen dadurch nicht. Die Shadow-DB ist NICHT deckungsgleich mit Prod — Details in den Warnungen oben."
          fi
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures structural migration failures — drift check cannot run reliably."
            exit 1
          fi

      - name: Sanity-check applied schema
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          # Lower bound: a healthy fresh-apply has ≥ 50 tables in public.
          # If we got fewer, something more than REVOKE warnings broke.
          count=$(psql -h localhost -U postgres -d postgres -tAc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "Public-schema base table count: $count"
          if [ "$count" -lt 50 ]; then
            echo "::error::Schema sanity check failed: only $count tables in public schema (expected ≥ 50). Migrations did not apply cleanly."
            exit 1
          fi

      - name: Verify audit whitelist vs real schema
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          # PROJ-Y-130s: `_tracked_audit_columns` nannte 58 Spalten, die es nicht gibt.
          # `record_audit_changes` macht `to_jsonb(OLD) -> v_col`; ein fehlender Schluessel
          # liefert SQL-NULL, und `NULL is distinct from NULL` ist false — die Feldaenderung
          # wird lautlos NICHT protokolliert. Kein Fehler, keine Meldung, kein Log. Genau
          # deshalb blieb der Defekt von PROJ-21 (2026-05-01) bis PROJ-Y-130s unbemerkt.
          #
          # Warum hier und nicht als Dateianalyse (wie check:function-inventory): 14 der 78
          # Whitelist-Migrationen patchen die Funktion per Anker-Ersetzung aus der jeweils
          # LIVE-Definition. Statisch ist die effektive Whitelist damit nicht rekonstruierbar
          # — eine Dateianalyse muesste sie raten. Die Shadow-DB hat sie.
          #
          # AUSNAHMELISTE IST LEER und soll es bleiben. Ein Eintrag hier heisst: "diese
          # Feldaenderung wird bewusst nicht protokolliert" — das ist eine Compliance-
          # Entscheidung und gehoert in eine Slice, nicht in eine Zeile Workflow.
          EXCEPTIONS="array[]::text[]"

          if ! psql -h localhost -U postgres -d postgres -tAc \
                "select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace \
                 where n.nspname='public' and p.proname='_tracked_audit_columns'" | grep -q 1; then
            echo "::error::_tracked_audit_columns fehlt in der Shadow-DB — die Audit-Whitelist kann nicht geprueft werden."
            exit 1
          fi

          # Geisterspalten: in der Whitelist genannt, im realen Schema nicht vorhanden.
          # Nur Tabellen, die es gibt — eine fehlende Tabelle ist ein ANDERER Befund (s. u.),
          # und sie als 5 Geisterspalten zu melden wuerde die Diagnose verfaelschen.
          GHOSTS=$(psql -h localhost -U postgres -d postgres -tA <<SQL
          with tabs as (
            select distinct m[1] as tbl
            from regexp_matches(
              (select pg_get_functiondef(p.oid) from pg_proc p
               join pg_namespace n on n.oid = p.pronamespace
               where n.nspname='public' and p.proname='_tracked_audit_columns'),
              \$\$when\\s+'([a-z_]+)'\\s+then\\s+array\\[\$\$, 'g') m
          )
          select t.tbl || '.' || c.col
          from tabs t
          cross join lateral unnest(public._tracked_audit_columns(t.tbl)) as c(col)
          where exists (select 1 from information_schema.tables
                        where table_schema='public' and table_name=t.tbl and table_type='BASE TABLE')
            and not exists (select 1 from information_schema.columns
                            where table_schema='public' and table_name=t.tbl and column_name=c.col)
            and not (t.tbl || '.' || c.col = any($EXCEPTIONS))
          order by 1;
          SQL
          )

          # Getrennte Kategorie: Whitelist nennt eine Tabelle, die es in dieser Umgebung nicht
          # gibt. In der Shadow-DB ist das meist Folge eines Fresh-Apply-Abbruchs (PROJ-Y-130f)
          # und nicht Sache dieses Waechters — gemeldet, aber nicht hart.
          MISSING=$(psql -h localhost -U postgres -d postgres -tA <<SQL
          with tabs as (
            select distinct m[1] as tbl
            from regexp_matches(
              (select pg_get_functiondef(p.oid) from pg_proc p
               join pg_namespace n on n.oid = p.pronamespace
               where n.nspname='public' and p.proname='_tracked_audit_columns'),
              \$\$when\\s+'([a-z_]+)'\\s+then\\s+array\\[\$\$, 'g') m
          )
          select t.tbl from tabs t
          where not exists (select 1 from information_schema.tables
                            where table_schema='public' and table_name=t.tbl and table_type='BASE TABLE')
          order by 1;
          SQL
          )

          if [ -n "$MISSING" ]; then
            echo "::warning::Audit-Whitelist nennt Tabellen, die in dieser Umgebung fehlen (eigener Befund, nicht Geisterspalten):"
            printf '  %s\n' $MISSING
          fi

          if [ -n "$GHOSTS" ]; then
            n=$(printf '%s\n' "$GHOSTS" | grep -c . || true)
            echo "::error::Audit-Whitelist nennt $n Spalte(n), die es nicht gibt. Feldaenderungen daran werden LAUTLOS nicht protokolliert (PROJ-Y-130s):"
            printf '  %s\n' $GHOSTS
            echo ""
            echo "Entweder die Spalte heisst anders (dann den Whitelist-Eintrag korrigieren),"
            echo "oder sie existiert nicht mehr (dann den Eintrag entfernen)."
            exit 1
          fi

          echo "Audit-Whitelist: 0 Geisterspalten."

      - name: Run schema-drift check
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: npm run check:schema-drift
